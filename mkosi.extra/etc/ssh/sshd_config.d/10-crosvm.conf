# Key-only ssh, no root login. sshd uses the first value it sees for each
# option, so the 10- prefix wins over distro drop-ins such as 50-redhat.conf.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# Keys live outside the home directory, so they still work when a host
# directory is mounted over it (SHARE_HOME= in run-crosvm.sh).
AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u .ssh/authorized_keys
