# kernel-install(8), which the kernel packages of Debian, Ubuntu and Fedora
# run: every kernel they install gets a boot entry in the EFI system
# partition (/efi), loader/entries/<distro>-<version>.conf with the kernel
# and its initrd in /<distro>/<version>/. gerantd boots the newest one at
# the guest's next start or reboot (gerant-boot(8)). Without this, the
# layout would be "other" and nothing would go there.
layout=bls
