# The initrd dracut builds for every kernel the guest installs: the root
# file system is ext4 on virtio-blk, found by root=PARTLABEL=root, and
# nothing else is needed before switch-root (like KernelInitrdModules= in
# mkosi.conf). 10 to 18 MB instead of 20 to 40.
# Not hostonly: that takes whatever modules happen to be loaded. Only
# these dracut modules (and the ones they need): the others bring their own
# drivers, whatever drivers= says. No network module, so the initrd ignores
# the ip= gerantd puts on the command line.
hostonly="no"
dracutmodules="systemd-initrd rootfs-block kernel-modules"
drivers="virtio_pci virtio_blk ext4"
# A guest can't load microcode (21 MB of it on Ubuntu).
early_microcode="no"
