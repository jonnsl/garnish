[Match]
Distribution=arch

[Output]
Output=archlinux

[Content]
# mkinitcpio's settings, in place before it's installed: they make it build
# a unified kernel image in /efi on every kernel update.
SkeletonTrees=mkosi.skeleton-arch
# The name mkinitcpio gives the images it builds in the guest
# (mkosi.skeleton-arch/etc/mkinitcpio.d/linux.preset), so the first kernel
# update replaces this one.
UnifiedKernelImageFormat=arch-linux
# libxcb*: hard build/link dependency of sommelier even when X11 (-X) is unused.
Hostname=arch-crosvm
Packages=
        base
        linux
        mkinitcpio
        openssh
        sudo
        mesa
        wayland
        libdrm
        libxcb
        libxkbcommon
        pixman
        pipewire
        pipewire-alsa
        pipewire-pulse
        wireplumber
        alsa-utils

BuildPackages=
        base-devel
        git
        meson
        ninja
        python-jinja
        rust
