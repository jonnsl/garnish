# Debian, Ubuntu and Fedora install new kernels in the EFI system partition
# with kernel-install, with a dracut initrd (mkosi.extra-kernel-install/,
# mkosi.postinst.chroot). Arch uses mkinitcpio (10-arch.conf).
[Match]
Distribution=|debian
Distribution=|ubuntu
Distribution=|fedora

[Content]
ExtraTrees=mkosi.extra-kernel-install
Packages=dracut
