# garnish VMs: the root file system is ext4 on virtio-blk, found by
# root=PARTLABEL=root, and nothing else is needed before switch-root (like
# KernelInitrdModules= in mkosi.conf). No autodetect: the image is built on
# other hardware than it runs on.
MODULES=(virtio_pci virtio_blk ext4)
HOOKS=(base systemd modconf)
