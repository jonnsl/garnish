# The kernels to boot: gerantd boots the newest one in here (gerant-boot(8)),
# and UEFI boot (crosvm --bios OVMF) works too.
[Partition]
Type=esp
# Mounted at /efi by this label on Arch (mkosi.postinst.chroot).
Label=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
