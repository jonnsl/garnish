# Common configuration for all distributions.
# Pick the distribution on the command line, e.g.:
#   mkosi -d debian build
# Distribution specific settings live in mkosi.conf.d/.
# mkosi finds this file from the repository root by itself (mkosi/mkosi.conf),
# and relative paths in here are relative to this directory.

[Distribution]
# x86-64 only. Building on a non-x86-64 host would need binfmt emulation.
Architecture=x86-64

[Output]
Format=disk
OutputDirectory=mkosi.output
# crosvm boots the kernel directly, so ship vmlinuz + initrd next to the disk.
SplitArtifacts=kernel,initrd

[Build]
# Use a mkosi tools tree so apt/dnf/pacman don't need to be installed on the host.
ToolsTree=yes
# Needed by mkosi.build.chroot to clone sommelier.
WithNetwork=yes
# The whole repository, at $SRCDIR: the build needs vm_tools/carte, and
# postinst mkosi/authorized_keys. Without this it would depend on where
# mkosi is run from (-C).
BuildSources=..
# Knobs consumed by mkosi.build.chroot / mkosi.postinst.chroot.
# Override any of them from the CLI, e.g. `mkosi -E PASSWORDLESS_SUDO=no build`,
# or persistently in mkosi.local.conf.
Environment=GUEST_USER=jonnathan
            GUEST_PASSWORD=changeme
            PASSWORDLESS_SUDO=yes
            SOMMELIER_REPO=https://chromium.googlesource.com/chromiumos/platform2
            SOMMELIER_REF=main
            GUEST_ADDRESS=192.168.10.2/24
            GUEST_GATEWAY=192.168.10.1
            GUEST_DNS=1.1.1.1,9.9.9.9

[Content]
Locale=C.UTF-8
Timezone=UTC
# We ship our own sshd-vsock units (mkosi.extra), don't let mkosi add its own.
Ssh=never
# Without this mkosi puts every kernel module in the initrd (120-400 MiB).
# The initrd only has to find the virtio-blk root and mount ext4; everything
# else (net, vsock, virtiofs, gpu) is loaded from the root fs after switch-root.
# Dependencies are added automatically; modules built into a kernel are skipped.
# crc32c*: before 6.14, ext4 gets crc32c through the crypto API, a softdep
# mkosi doesn't follow ("EXT4-fs: Cannot load crc32c driver" on Debian 6.12).
KernelInitrdModules=virtio_pci
                    virtio_blk
                    ext4
                    crc32c*
# root=PARTLABEL=root matches mkosi.repart/10-root.conf.
# video=Virtual-1:d stops crosvm from opening an empty (black) display window.
# Note: when booting kernel+initrd directly with crosvm this line is NOT used,
# pass the same parameters with `crosvm run -p ...` (see run-crosvm.sh).
KernelCommandLine=root=PARTLABEL=root rw
                  console=ttyS0
                  systemd.firstboot=off
                  video=Virtual-1:d
