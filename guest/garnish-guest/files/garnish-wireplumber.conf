# The guest's sound goes to the host, where Salle (or the host's own sound
# settings) sets each VM's volume. The host can only turn it down, so start
# the guest's output at full volume instead of WirePlumber's 40%. This only
# applies to outputs WirePlumber hasn't saved a volume for yet.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
