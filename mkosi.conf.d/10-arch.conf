[Match]
Distribution=arch

[Output]
Output=archlinux

[Content]
# libxcb*: hard build/link dependency of sommelier even when X11 (-X) is unused.
Hostname=arch-crosvm
Packages=
        base
        linux
        openssh
        sudo
        mesa
        wayland
        libdrm
        libxcb
        libxkbcommon
        pixman
        pipewire
        pipewire-alsa
        pipewire-pulse
        wireplumber
        alsa-utils

BuildPackages=
        base-devel
        git
        meson
        ninja
        python-jinja
        rust
