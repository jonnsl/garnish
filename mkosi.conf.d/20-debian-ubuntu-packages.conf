# Package names shared by Debian and Ubuntu.
# dbus-user-session is required for a D-Bus session bus in `systemd --user`.
# libpam-systemd (pam_systemd) sets XDG_RUNTIME_DIR; without it user@.service
# fails and sommelier never starts.
# libxcb*: hard build/link dependency of sommelier even when X11 (-X) is unused.
[Match]
Distribution=|debian
Distribution=|ubuntu

[Content]
Packages=
        apt
        systemd
        systemd-sysv
        systemd-boot
        systemd-resolved
        udev
        dbus
        dbus-user-session
        kmod
        libpam-systemd
        iproute2
        openssh-server
        sudo
        libgl1-mesa-dri
        libegl1
        libgbm1
        libdrm2
        libpixman-1-0
        libwayland-client0
        libwayland-server0
        libxcb1
        libxcb-composite0
        libxcb-shape0
        libxcb-xfixes0
        libxkbcommon0

BuildPackages=
        build-essential
        ca-certificates
        git
        meson
        ninja-build
        pkgconf
        python3
        python3-jinja2
        libwayland-bin
        libwayland-dev
        libgbm-dev
        libdrm-dev
        libpixman-1-dev
        libxcb1-dev
        libxcb-composite0-dev
        libxcb-shape0-dev
        libxcb-xfixes0-dev
        libxkbcommon-dev
