[Match]
Distribution=fedora

[Distribution]
Release=44

[Output]
Output=fedora

[Content]
# libxcb*: hard build/link dependency of sommelier even when X11 (-X) is unused.
Hostname=fedora-crosvm
Packages=
        kernel
        systemd
        systemd-networkd
        systemd-pam
        systemd-resolved
        systemd-udev
        systemd-boot-unsigned
        dbus
        dnf
        util-linux
        shadow-utils
        passwd
        iproute
        openssh-server
        sudo
        mesa-dri-drivers
        mesa-libEGL
        mesa-libgbm
        libdrm
        pixman
        libwayland-client
        libwayland-server
        libxcb
        libxkbcommon

BuildPackages=
        gcc
        gcc-c++
        git-core
        meson
        ninja-build
        pkgconf-pkg-config
        python3
        python3-jinja2
        wayland-devel
        mesa-libgbm-devel
        libdrm-devel
        pixman-devel
        libxcb-devel
        libxkbcommon-devel
