# ~/.config/garnish/vms/debian.conf: `maitre start debian`.
# Relative paths are relative to this file, and ~ is your home directory.

[Boot]
# Kernel= and Initrd= default to debian.vmlinuz and debian.initrd next to it.
Image=~/src/mkosi_experiments/mkosi/mkosi.output/debian.raw
# Added to the default command line; KernelCommandLine= replaces it.
#KernelCommandLineExtra=quiet

[Machine]
# A name for people, shown by Salle instead of "debian". Any text.
#Title=Debian
CPUs=4
Memory=4G
# A host directory as the guest user's home, over virtio-fs.
#SharedHome=~/vm/debian-home
# Sound through vhost-device-sound; Microphone=yes lets the guest record.
Audio=no
Microphone=no
# A GPU with the cross-domain context and the host's Wayland socket, for
# sommelier. Add virgl2 only if crosvm was built with virglrenderer.
Wayland=yes
GpuContextTypes=cross-domain
# Passed to `crosvm run` as they are.
#ExtraArguments=

[Network]
# passt: internet access through passt, a program that runs as you; the
#   guest's connections are made by the host for it. Needs no setup.
# nat: a network device of its own on the host, with an address the host can
#   reach and NAT to the outside (from maitre-net, a setuid helper).
# none: no network.
Mode=passt

[Guest]
# The user the image was built with (GUEST_USER). By default your user name.
#User=user
UID=1000
# Put the guest's applications in the host's application menu (carte sync).
AppMenu=yes
