# ~/.config/garnish/maitred.conf: what maitred hands out to VMs. Everything
# here is optional; these are the defaults. Restart maitred after a change.

[Pool]
# vsock context IDs.
CIDs=3-99
# Split into /30 networks, one per VM: the n-th uses tap <TapPrefix><n>, the
# host has its first address and the guest its second. Must match
# setup-host-net.sh.
Subnet=192.168.10.0/24
TapPrefix=crosvm_tap
# Given to the guests on the kernel command line; at most two.
DNS=1.1.1.1 9.9.9.9

[Manager]
# How long a guest gets to shut down after the power button before crosvm
# is stopped.
StopTimeoutSec=30
