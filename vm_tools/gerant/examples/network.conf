# /etc/garnish/network.conf: the guest networks of every user's VMs, read by
# gerant-net. Optional; these are the defaults. Only root may write it (the
# file has to belong to root and not be writable by anyone else).

[NAT]
# Split into /30 networks, one per running VM: the n-th uses tap garnish<n>,
# the host has its first address and the guest its second. Pick one that
# doesn't overlap a network the host is on. From /16 to /30.
Subnet=192.168.10.0/24
