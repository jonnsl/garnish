# ~/.config/garnish/gerantd.conf: what gerantd hands out to VMs. Everything
# here is optional; these are the defaults. Restart gerantd after a change.

[Pool]
# vsock context IDs.
CIDs=3-99
# Given to the guests on the kernel command line; at most two. The guests'
# addresses are set for all users, in /etc/garnish/network.conf.
DNS=1.1.1.1 9.9.9.9

[Manager]
# How long a guest gets to shut down after the power button before crosvm
# is stopped.
StopTimeoutSec=30
