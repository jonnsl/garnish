# Uncrustify config for Salle's Vala sources.
# Run with: uncrustify -c uncrustify.cfg -l VALA --replace --no-backup <files>

newlines                        = lf
input_tab_size                  = 4
output_tab_size                 = 4

# Indentation
indent_columns                  = 4
indent_with_tabs                = 0
indent_namespace                = true
indent_class                    = true
indent_switch_case              = 0
indent_case_brace               = 0
indent_func_call_param          = false
indent_paren_close              = 2
indent_align_paren              = true
# Wrapped lines get one extra level, unless they follow an open paren (then they align with it)
indent_continue                 = 4
indent_ignore_first_continue    = true
indent_off_after_return_new     = true

# Braces stay on the same line
nl_class_brace                  = remove
nl_namespace_brace              = remove
nl_fdef_brace                   = remove
nl_if_brace                     = remove
nl_else_brace                   = remove
nl_elseif_brace                 = remove
nl_for_brace                    = remove
nl_while_brace                  = remove
nl_do_brace                     = remove
nl_switch_brace                 = remove
nl_try_brace                    = remove
nl_catch_brace                  = remove
nl_finally_brace                = remove
nl_brace_else                   = remove
nl_brace_catch                  = remove
nl_brace_finally                = remove
nl_brace_while                  = remove

# Space before parentheses (elementary style)
sp_func_call_paren              = force
sp_func_def_paren               = force
sp_func_proto_paren             = force
sp_func_class_paren             = force
sp_before_sparen                = force
sp_after_sparen                 = force
sp_sizeof_paren                 = force
sp_inside_paren                 = remove
sp_inside_sparen                = remove
sp_inside_fparen                = remove
sp_inside_fparens               = remove
sp_paren_brace                  = force
sp_paren_paren                  = remove

# Operators and punctuation
sp_assign                       = force
sp_arith                        = force
sp_bool                         = force
sp_compare                      = force
sp_after_comma                  = force
sp_before_comma                 = remove
sp_before_semi                  = remove
sp_after_cast                   = force
sp_inside_braces                = force
sp_before_square                = remove
sp_inside_square                = remove
sp_angle_shift                  = remove
sp_inside_angle                 = remove
sp_else_brace                   = force
sp_brace_else                   = force
sp_catch_brace                  = force
sp_brace_catch                  = force
sp_finally_brace                = force
sp_brace_finally                = force
sp_try_brace                    = force

# Leave line breaking and blank lines to the author
code_width                      = 0
nl_max                          = 2
mod_remove_extra_semicolon      = true

# gettext macros keep the paren attached: _("text")
set func_call_user              _ N_ C_ NC_
sp_func_call_user_paren         = remove

# Keep short blocks and initializers on one line
nl_assign_leave_one_liners      = true
nl_class_leave_one_liners       = true
nl_func_leave_one_liners        = true
nl_enum_leave_one_liners        = true
nl_getset_leave_one_liners      = true
nl_if_leave_one_liners          = true
nl_create_list_one_liner        = true
