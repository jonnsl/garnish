[package]
name = "carte"
version = "0.1.0"
edition = "2021"
# Debian trixie's rustc. resolver 3 keeps the lockfile on crates that build with it.
rust-version = "1.85"
resolver = "3"
description = "Shows the applications of crosvm guests in the host's application menu"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
